<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Ilustração da faixa do Monitor OCT na barra de tarefas em quatro estados: normal, aviso, crítico e desconectado">
  <rect width="760" height="330" rx="14" fill="#e5e7eb"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- rótulos -->
    <g font-size="15" font-weight="700" fill="#1f2937">
      <text x="24" y="58">Normal</text>
      <text x="24" y="130">Aviso</text>
      <text x="24" y="202">Crítico</text>
      <text x="24" y="274">Desconectado</text>
    </g>

    <!-- barras de tarefas (desenho) -->
    <g>
      <rect x="140" y="30" width="600" height="44" fill="#1f2937"/>
      <rect x="140" y="102" width="600" height="44" fill="#1f2937"/>
      <rect x="140" y="174" width="600" height="44" fill="#1f2937"/>
      <rect x="140" y="246" width="600" height="44" fill="#1f2937"/>
    </g>
    <!-- bandeja e relógio -->
    <g fill="#9ca3af" font-size="13">
      <text x="726" y="57" text-anchor="end">14:32</text>
      <text x="726" y="129" text-anchor="end">14:32</text>
      <text x="726" y="201" text-anchor="end">14:32</text>
      <text x="726" y="273" text-anchor="end">14:32</text>
    </g>
    <!-- ícone da bandeja com a temperatura -->
    <g font-size="13" font-weight="700" text-anchor="middle">
      <rect x="652" y="40" width="24" height="24" fill="#00cc44"/><text x="664" y="57" fill="#ffffff">52</text>
      <rect x="652" y="112" width="24" height="24" fill="#ffcc00"/><text x="664" y="129" fill="#000000">55</text>
      <rect x="652" y="184" width="24" height="24" fill="#ff3333"/><text x="664" y="201" fill="#ffffff">91</text>
      <rect x="652" y="256" width="24" height="24" fill="#888888"/><text x="664" y="273" fill="#ffffff">50</text>
    </g>

    <!-- faixa do monitor -->
    <g font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
      <rect x="322" y="32" width="320" height="40" fill="#0f2042" stroke="#00cc44" stroke-width="3"/>
      <text x="482" y="57">SISTEMA OK | 1 Gbps | 52.0°C | CPU: 12%</text>

      <rect x="322" y="104" width="320" height="40" fill="#0f2042" stroke="#ffcc00" stroke-width="3"/>
      <text x="482" y="129">REDE LENTA 100Mb | Temp OK 55°C</text>

      <rect x="322" y="176" width="320" height="40" fill="#cc0000" stroke="#ff3333" stroke-width="3"/>
      <text x="482" y="201">LIGUE O AR CONDICIONADO (91°C)</text>

      <rect x="322" y="248" width="320" height="40" fill="#0f2042" stroke="#888888" stroke-width="3"/>
      <text x="482" y="273">RECONECTE O CABO DE REDE</text>
    </g>
  </g>
  <text x="740" y="318" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">ilustração — as cores são as padrão e podem ser trocadas nas Opções</text>
</svg>
