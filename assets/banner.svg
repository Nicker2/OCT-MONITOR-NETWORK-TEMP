<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Monitor OCT: temperatura da CPU e velocidade da rede">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0f2042"/>
    </linearGradient>
    <linearGradient id="mercurio" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.6" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#fundo)"/>

  <!-- termômetro -->
  <g transform="translate(120 150)">
    <rect x="-16" y="-100" width="32" height="150" rx="16" fill="#1e293b" stroke="#94a3b8" stroke-width="4"/>
    <rect x="-7" y="-60" width="14" height="110" rx="7" fill="url(#mercurio)"/>
    <circle cx="0" cy="70" r="30" fill="#ef4444" stroke="#94a3b8" stroke-width="4"/>
    <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
      <line x1="22" y1="-80" x2="34" y2="-80"/>
      <line x1="22" y1="-50" x2="34" y2="-50"/>
      <line x1="22" y1="-20" x2="34" y2="-20"/>
      <line x1="22" y1="10" x2="34" y2="10"/>
    </g>
  </g>

  <!-- cabo de rede (conector RJ45) -->
  <g transform="translate(240 150)">
    <path d="M0 -70 C0 -30 0 -10 0 20" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <rect x="-28" y="20" width="56" height="50" rx="6" fill="#38bdf8"/>
    <rect x="-18" y="70" width="36" height="14" rx="3" fill="#0ea5e9"/>
    <g fill="#0f172a">
      <rect x="-18" y="34" width="5" height="22" rx="1"/>
      <rect x="-8" y="34" width="5" height="22" rx="1"/>
      <rect x="2" y="34" width="5" height="22" rx="1"/>
      <rect x="12" y="34" width="5" height="22" rx="1"/>
    </g>
  </g>

  <!-- textos -->
  <text x="330" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f8fafc">Monitor OCT</text>
  <text x="332" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1">Avisa quando o calor ou o cabo deixam o exame lento.</text>

  <!-- faixa de status (desenho) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="332" y="206" width="250" height="40" rx="4" fill="#0f2042" stroke="#00cc44" stroke-width="3"/>
    <text x="457" y="232" text-anchor="middle" fill="#ffffff">SISTEMA OK | 1 Gbps</text>
    <rect x="596" y="206" width="250" height="40" rx="4" fill="#0f2042" stroke="#ffcc00" stroke-width="3"/>
    <text x="721" y="232" text-anchor="middle" fill="#ffffff">REDE LENTA 100Mb</text>
    <rect x="860" y="206" width="250" height="40" rx="4" fill="#cc0000" stroke="#ff3333" stroke-width="3"/>
    <text x="985" y="232" text-anchor="middle" fill="#ffffff">LIGUE O AR (90°C)</text>
  </g>
</svg>
